name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The C++ confirmation core is the deployed implementation; these gates must
  # run on every change. Previously CI validated only the frozen YAML targets,
  # so reintroducing the reducer recursion that crash-looped a production
  # controller would have left CI green.
  core:
    name: C++ core (host tests + sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `test` also runs the adapter suite; it is named separately here so a
      # failure is attributable at a glance in the checks list.
      - name: Host test suite
        run: make -C tests/cpp test
      - name: Adapter suite (ESPHome wiring against stubs)
        run: make -C tests/cpp test-adapter
      - name: Host test suite under ASan/UBSan
        run: make -C tests/cpp test-sanitized

  component:
    name: C++ component (config + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install esphome
      - name: Provide example secrets
        # The primary deployable config resolves `!secret` against its own
        # directory (the repository root). The placeholders in the example are
        # syntactically valid, so validation needs nothing real.
        run: cp secrets.yaml.example secrets.yaml
      - name: esphome config (C++ / SX127x)
        run: esphome config quietcool-cpp-example.yaml
      - name: esphome config (C++ / SX126x)
        run: esphome config quietcool-cpp-example-sx126x.yaml
      # The primary deployable config and the diagnostic harness that packages
      # it used to be absent from CI entirely, while the README claimed CI
      # covered every checked-in target. They are validated here; they are NOT
      # compiled, so their display/entity lambdas are only ever built by the
      # pre-PR checklist in CONTRIBUTING.md. Closing that remaining gap costs a
      # third ESP-IDF build — do it deliberately, not by editing the README.
      - name: esphome config (C++ / primary deployable)
        run: esphome config quietcool-cpp-lora32.yaml
      - name: esphome config (C++ / loop-stack diagnostic)
        run: esphome config quietcool-cpp-diag.yaml
      - name: Compile (C++ / SX127x)
        run: esphome compile quietcool-cpp-example.yaml
      - name: Compile (C++ / SX126x)
        run: esphome compile quietcool-cpp-example-sx126x.yaml

  legacy-yaml:
    name: Frozen YAML targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install esphome
      - name: Provide example secrets
        # ESPHome resolves !secret against the config file's own directory,
        # so the frozen legacy configs need their copy under legacy/.
        run: |
          cp secrets.yaml.example secrets.yaml
          cp secrets.yaml.example legacy/secrets.yaml
      - name: Config regression tests
        run: python -m unittest tests.test_quietcool_esphome_config -v
      - name: esphome config (LoRa32 V2.1 / SX1278)
        run: esphome config legacy/quietcool-lora32.yaml
      - name: esphome config (LoRa V3 / SX1262)
        run: esphome config legacy/quietcool-lora-v3.yaml
      - name: Compile (LoRa32 V2.1 / SX1278)
        run: esphome compile legacy/quietcool-lora32.yaml
      - name: Compile (LoRa V3 / SX1262)
        run: esphome compile legacy/quietcool-lora-v3.yaml

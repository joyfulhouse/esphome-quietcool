# QuietCool C++ build — HiLetgo / Heltec ESP32 LoRa V3 (SX1262) BRING-UP config.
#
# Purpose: produce hardware evidence for the V3 port. It is
# quietcool-cpp-example-sx126x.yaml (radio block unchanged) plus:
#   - wifi / api / ota so it can be flashed, adopted and logged
#   - every QuietCool diagnostic ENABLED (not hidden) in Home Assistant
#   - an RX tap that logs each packet's bytes, RSSI and SNR
#   - one small, explicit check for each "PIN CONFIDENCE" item in
#     docs/hardware.md: Vext/OLED, status-LED polarity, VBAT ADC, PRG button
#   - loop-task stack high-water mark (new MCU: ESP32-S3)
#
# It deliberately has NO dashboard display page, temperature helpers or
# status_led: those depend on the items under test. Once bring-up passes,
# the owner can fold the results into a proper deployable V3 config.
#
# Safety: same firmware rules as every C++ build. It never sends a fan
# command unless you ask it to. A provisioned unit sends a NON-energizing
# 66 66 status query shortly after boot and every heartbeat_interval.
# ATTACH THE 433 MHz ANTENNA BEFORE POWERING THE BOARD.
#
# Build from a checkout (repo root):
#   cp -n secrets.yaml.example secrets.yaml   # then fill in the V3 keys
#   .venv/bin/esphome run quietcool-cpp-lora-v3-bringup.yaml

substitutions:
  device_name: quietcool-lora-v3
  device_friendly_name: "QuietCool V3 Bring-up"
  fallback_ap_ssid: "QuietCool-LoRa-V3"
  api_key_secret: !secret quietcool_lora_v3_api_key
  ota_password_secret: !secret quietcool_lora_v3_ota_password
  fallback_ap_password_secret: !secret quietcool_lora_v3_fallback_ap_password

  # "0" = unprovisioned / learn mode. Leave it for bring-up; pairing is test 6.
  quietcool_sender_id: "0"

  # RX filter bandwidth under test. 58_6kHz is the checked-in value. If RX is
  # marginal, rebuild with 78_2kHz (next wider FSK-legal SX1262 step) and
  # repeat the RSSI/RX tests. RX-only: does not change the transmitted signal.
  rx_bandwidth: 58_6kHz

  cpp_components_root: "components"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  min_version: 2026.7.0
  # Vext must be on BEFORE the I2C bus sets up and scans. i2c runs at
  # setup_priority::BUS (1000) but the vext_power gpio switch only at
  # HARDWARE (800), so without this the scan always ran against an
  # unpowered OLED ("SCL is held low", "Found no devices"). Priority 1100
  # runs first; the vext_power switch below then keeps the pin low.
  on_boot:
    - priority: 1100
      then:
        - lambda: |-
            gpio_reset_pin(GPIO_NUM_36);
            gpio_set_direction(GPIO_NUM_36, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_36, 0);  // Vext is active-low
            delay(50);  // let the OLED rail settle

esp32:
  board: heltec_wifi_lora_32_V3
  # REQUIRED by the quietcool component (codegen rejects less).
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 16384

logger:
  level: DEBUG

api:
  encryption:
    key: ${api_key_secret}

ota:
  platform: esphome
  password: ${ota_password_secret}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${fallback_ap_ssid}
    password: ${fallback_ap_password_secret}

captive_portal:

# Reset reason + free heap, so any crash/reboot shows up in the report.
debug:
  update_interval: 30s

external_components:
  - source:
      type: local
      path: ${cpp_components_root}
    components:
      - quietcool

# -----------------------------------------------------------------------------
# Board power rails (PIN CONFIDENCE: Vext HIGH, VBAT-enable MEDIUM)
# -----------------------------------------------------------------------------
switch:
  # Vext (GPIO36, active-low) powers the OLED. Kept internal and always on.
  - platform: gpio
    id: vext_power
    internal: true
    pin:
      number: GPIO36
      inverted: true
    restore_mode: ALWAYS_ON

  # VBAT divider enable (GPIO37, assumed active-low). Exposed on purpose:
  # toggling it and watching "VBAT ADC Raw" proves which level enables the
  # divider. Expected: ON -> ~0.85 V raw with a charged cell, OFF -> ~0 V.
  - platform: gpio
    id: battery_adc_enable
    name: "Test: VBAT ADC Enable (GPIO37)"
    entity_category: config
    pin:
      number: GPIO37
      inverted: true
    restore_mode: ALWAYS_ON

# -----------------------------------------------------------------------------
# OLED (PIN CONFIDENCE: HIGH). Fontless test pattern: a frame plus a block
# that toggles each second. Visible + blinking = Vext, I2C, reset all good.
# -----------------------------------------------------------------------------
i2c:
  sda: GPIO17
  scl: GPIO18
  frequency: 400kHz
  scan: true

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: GPIO21
    update_interval: 1s
    lambda: |-
      it.rectangle(0, 0, it.get_width(), it.get_height());
      if ((millis() / 1000) % 2 == 0) {
        it.filled_rectangle(8, 8, 48, 48);
      } else {
        it.filled_rectangle(72, 8, 48, 48);
      }

# -----------------------------------------------------------------------------
# Status LED (GPIO35, polarity UNCONFIRMED). Plain non-inverted output: if
# turning this ON in HA lights the white LED, the LED is active-high.
# -----------------------------------------------------------------------------
output:
  - platform: gpio
    id: led_output
    pin: GPIO35

light:
  - platform: binary
    name: "Test: Onboard LED (GPIO35, non-inverted)"
    output: led_output
    entity_category: config
    restore_mode: ALWAYS_OFF

# -----------------------------------------------------------------------------
# Radio — identical to quietcool-cpp-example-sx126x.yaml except the
# bandwidth substitution and the logging tap in on_packet.
# -----------------------------------------------------------------------------
spi:
  clk_pin: GPIO9
  miso_pin: GPIO11
  mosi_pin: GPIO10

sx126x:
  id: fan_radio
  cs_pin: GPIO8
  busy_pin: GPIO13
  dio1_pin: GPIO14
  rst_pin: GPIO12
  hw_version: sx1262
  rf_switch: true
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  frequency: 433920000
  modulation: FSK
  shaping: NONE
  bandwidth: ${rx_bandwidth}
  bitrate: 2400
  deviation: 10000
  sync_value: [0x2D, 0xD4]
  payload_length: 0
  crc_enable: false
  whitening_enable: false
  preamble_size: 8
  preamble_detect: 0
  pa_power: 17
  rx_start: true
  on_packet:
    # Log-only tap; the identical packet is then handed to the core.
    - lambda: |-
        id(rx_packet_count) += 1;
        ESP_LOGI("qc.rx", "RX #%u: %u bytes rssi=%.1f dBm snr=%.1f dB: %s",
                 (unsigned) id(rx_packet_count), (unsigned) x.size(),
                 rssi, snr, format_hex_pretty(x).c_str());
        id(rx_rssi_sensor).publish_state(rssi);
        id(rx_len_sensor).publish_state(x.size());
    - quietcool.on_packet:
        id: quietcool_controller
        packet: received_packet

globals:
  - id: rx_packet_count
    type: uint32_t
    initial_value: "0"

quietcool:
  id: quietcool_controller
  sender_seed: ${quietcool_sender_id}
  radio:
    type: sx126x
    id: fan_radio

# -----------------------------------------------------------------------------
# QuietCool entities — names match quietcool-cpp-lora32.yaml; all enabled.
# -----------------------------------------------------------------------------
fan:
  - platform: quietcool
    id: whole_house_fan
    controller_id: quietcool_controller
    name: "QuietCool Fan"

select:
  - platform: quietcool
    controller_id: quietcool_controller
    name: "Fan Timer"

binary_sensor:
  - platform: quietcool
    controller_id: quietcool_controller
    kind: state_known
    name: "Fan State Known"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: timer_program_known
    name: "Timer State Known"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: timer_remaining_known
    name: "Fan Timer Remaining Known"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: confirmed_off
    name: "Fan Confirmed Off"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: controller_fault
    device_class: problem
    name: "Controller Fault"
  # PRG/BOOT button (GPIO0). Press it: this should read ON while held.
  - platform: gpio
    name: "Test: PRG Button (GPIO0)"
    entity_category: diagnostic
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true

text_sensor:
  - platform: quietcool
    controller_id: quietcool_controller
    kind: command_status
    name: "Command Confirmation Status"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: evidence_source
    name: "Fan Evidence Source"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: last_tx_command
    name: "Last TX Command"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: last_rx_frame
    name: "Last Valid RX Frame"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: last_confirmed_state
    name: "Last Confirmed Fan State"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: speed_capability
    name: "Fan Speed Capability"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: remote_sender_id
    name: "Remote Sender ID"
  - platform: debug
    reset_reason:
      name: "Reset Reason"
  - platform: version
    name: "ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "IP Address"

sensor:
  - platform: quietcool
    controller_id: quietcool_controller
    kind: timer_remaining
    name: "Timer Remaining"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: tx_count
    name: "TX Count"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: rx_valid_count
    name: "RX Valid Count"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: rx_rejected_count
    name: "RX Rejected Count"

  # Published from the on_packet tap above.
  - platform: template
    id: rx_rssi_sensor
    name: "Last RX RSSI"
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: rx_len_sensor
    name: "Last RX Length"
    unit_of_measurement: "bytes"
    accuracy_decimals: 0
    entity_category: diagnostic

  # VBAT (GPIO1, 390k/100k divider -> x4.9). Raw pin voltage is shown too,
  # so the divider ratio can be checked against a multimeter.
  - platform: adc
    pin: GPIO1
    id: vbat_raw
    name: "Test: VBAT ADC Raw (GPIO1)"
    entity_category: diagnostic
    attenuation: 12db
    update_interval: 10s
    accuracy_decimals: 3
  - platform: copy
    source_id: vbat_raw
    name: "Battery Voltage (x4.9)"
    entity_category: diagnostic
    accuracy_decimals: 2
    filters:
      - multiply: 4.9

  - platform: template
    id: loop_stack_free
    name: "Loop Stack Min Free"
    unit_of_measurement: "B"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return (float) uxTaskGetStackHighWaterMark(nullptr);

  - platform: debug
    free:
      name: "Heap Free"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

button:
  - platform: quietcool
    controller_id: quietcool_controller
    kind: refresh
    name: "Refresh Fan State"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: learn
    name: "Learn Remote ID"
  - platform: quietcool
    controller_id: quietcool_controller
    kind: forget
    name: "Forget Remote ID"
  - platform: restart
    name: "Restart"
